---
on:
  workflow_call:
    inputs:
      release_version:
        description: Release version used for download server publication
        required: false
        default: ''
        type: string
    secrets:
      DOCS_SSH_KEY:
        required: false
      DOCS_HOST:
        required: false
      DOCS_SSH_USER:
        required: false
      DOCS_REMOTE_PATH:
        required: false
      DOCS_SSH_KNOWN_HOSTS:
        required: false
      REPOSITORY_SSH_KEY:
        required: false
      REPOSITORY_HOST:
        required: false
      REPOSITORY_SSH_USER:
        required: false
      REPOSITORY_REMOTE_PATH:
        required: false
      REPOSITORY_SSH_KNOWN_HOSTS:
        required: false
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yml'
    branches:
      - master
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yml'
    branches:
      - master
jobs:
  build:
    name: "Build documentation"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    outputs:
      git_hash: ${{ steps.githash.outputs.git_hash }}
    steps:
     - uses: actions/checkout@v7
       with:
         submodules: false
         # The full history: every page shows its last commit, and the
         # version badge needs the release tags.
         fetch-depth: 0

     - name: Find the git hash
       id: githash
       run: |
         echo "git_hash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

     - uses: actions/setup-node@v7
       with:
         node-version: 22
         cache: npm
         cache-dependency-path: docs/package-lock.json

     - name: Install dependencies
       run: npm ci

     - name: Generate the pages and the PDFs
       run: npm run build:docs

     - name: Upload the PDFs artifact
       uses: actions/upload-artifact@v7
       with:
         name: XCSoar-docs-pdfs-${{ steps.githash.outputs.git_hash }}
         path: docs/.output/public/pdfs/*.pdf

     - name: Upload the pages artifact
       if: ${{ inputs.release_version != '' && github.repository == 'XCSoar/XCSoar' }}
       uses: actions/upload-artifact@v7
       with:
         name: XCSoar-docs-pages-${{ steps.githash.outputs.git_hash }}
         path: docs/.output/public
         # The .htaccess with the permalink redirects.
         include-hidden-files: true
         retention-days: 1

  deploy-docs:
    name: "Deploy the documentation"
    needs: build
    if: ${{ inputs.release_version != '' && github.repository == 'XCSoar/XCSoar' }}
    runs-on: ubuntu-24.04
    steps:
     - uses: actions/download-artifact@v7
       with:
         name: XCSoar-docs-pages-${{ needs.build.outputs.git_hash }}
         path: pages

     - name: Deploy to the documentation server
       env:
         SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
         KNOWN_HOSTS: ${{ secrets.DOCS_SSH_KNOWN_HOSTS }}
         HOST: ${{ secrets.DOCS_HOST }}
         USERNAME: ${{ secrets.DOCS_SSH_USER }}
         REMOTE_PATH: ${{ secrets.DOCS_REMOTE_PATH }}
       run: |
         mkdir -p ~/.ssh
         echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
         echo "$SSH_KEY" > ~/.ssh/deploy_key
         chmod 600 ~/.ssh/deploy_key
         ssh="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
         $ssh "$USERNAME@$HOST" mkdir -p "$REMOTE_PATH"
         rsync -rltzv --delete -e "$ssh" pages/ "$USERNAME@$HOST:$REMOTE_PATH/"

  deploy-pdfs:
    name: "Publish the manual PDFs"
    needs: build
    if: ${{ inputs.release_version != '' && github.repository == 'XCSoar/XCSoar' }}
    runs-on: ubuntu-24.04
    steps:
     - uses: actions/download-artifact@v7
       with:
         name: XCSoar-docs-pdfs-${{ needs.build.outputs.git_hash }}
         path: pdfs

     - name: Upload the manual PDFs to the GitHub Release
       env:
         GH_TOKEN: ${{ github.token }}
       run: |
         gh release upload "$GITHUB_REF_NAME" pdfs/*.pdf --clobber

     - name: Deploy the manual PDFs to the Download server
       env:
         SSH_KEY: ${{ secrets.REPOSITORY_SSH_KEY }}
         KNOWN_HOSTS: ${{ secrets.REPOSITORY_SSH_KNOWN_HOSTS }}
         HOST: ${{ secrets.REPOSITORY_HOST }}
         USERNAME: ${{ secrets.REPOSITORY_SSH_USER }}
         REMOTE_PATH: ${{ secrets.REPOSITORY_REMOTE_PATH }}
         VERSION: ${{ inputs.release_version }}
       run: |
         mkdir -p ~/.ssh
         echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
         echo "$SSH_KEY" > ~/.ssh/deploy_key
         chmod 600 ~/.ssh/deploy_key
         ssh="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
         $ssh "$USERNAME@$HOST" mkdir -p "$REMOTE_PATH/releases/$VERSION"
         rsync -rltzv -e "$ssh" pdfs/ "$USERNAME@$HOST:$REMOTE_PATH/releases/$VERSION/"
