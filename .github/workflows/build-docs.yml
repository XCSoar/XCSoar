---
on:
  workflow_call:
    inputs:
      release_version:
        description: Release version used for download server publication
        required: false
        default: ''
        type: string
    secrets:
      REPOSITORY_SSH_KEY:
        required: false
      REPOSITORY_HOST:
        required: false
      REPOSITORY_SSH_USER:
        required: false
      REPOSITORY_REMOTE_PATH:
        required: false
      REPOSITORY_SSH_KNOWN_HOSTS:
        required: false
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yml'
    branches:
      - master
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/build-docs.yml'
    branches:
      - master
jobs:
  docs:
    name: "Build documentation"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
     - uses: actions/checkout@v7
       with:
         submodules: false
         # The full history: every page shows its last commit, and the
         # version badge needs the release tags.
         fetch-depth: 0

     - name: find githash
       run: |
         echo "git_hash=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

     - uses: actions/setup-node@v7
       with:
         node-version: 22
         cache: npm
         cache-dependency-path: docs/package-lock.json

     - name: Install dependencies
       run: npm ci

     - name: Generate the site
       run: npm run generate

     - name: Print the PDFs
       run: |
         npm run pdf -- manual
         npm run pdf -- quick-guide

     - name: upload artifact
       uses: actions/upload-artifact@v7
       with:
         name: XCSoar-docs-pdf-${{ env.git_hash }}
         path: output/manual/*.pdf

     - name: Deploy manuals to Download server
       if: ${{ inputs.release_version != '' && github.repository == 'XCSoar/XCSoar' }}
       env:
         SSH_KEY: ${{ secrets.REPOSITORY_SSH_KEY }}
         KNOWN_HOSTS: ${{ secrets.REPOSITORY_SSH_KNOWN_HOSTS }}
         HOST: ${{ secrets.REPOSITORY_HOST }}
         USERNAME: ${{ secrets.REPOSITORY_SSH_USER }}
         REMOTE_PATH: ${{ secrets.REPOSITORY_REMOTE_PATH }}
         VERSION: ${{ inputs.release_version }}
       run: |
         mkdir -p ~/.ssh
         echo "$SSH_KEY" > ~/.ssh/deploy_key
         chmod 600 ~/.ssh/deploy_key
         # Pin the host key from the secret; without it, trust it on
         # first contact for this run only.
         echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
         ssh="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
         $ssh "$USERNAME@$HOST" mkdir -p "$REMOTE_PATH/releases/$VERSION" "$REMOTE_PATH/docs"
         rsync -rltzv -e "$ssh" ../output/manual/ "$USERNAME@$HOST:$REMOTE_PATH/releases/$VERSION/"
         rsync -rltzv --delete -e "$ssh" .output/public/ "$USERNAME@$HOST:$REMOTE_PATH/docs/"
