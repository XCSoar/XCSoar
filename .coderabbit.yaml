# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      # Default detection scopes .cursor/rules/ to that folder only.
      - files: ".cursor/rules/xcsoar-project-rules.mdc"
        applyTo: "**/*.{cpp,hpp,h,c,java,mk,yml}"
      - files: ".cursor/rules/utf8-safety.mdc"
        applyTo: "**/*.{cpp,hpp,h,c}"
      - files: ".cursor/rules/cpp-safety-patterns.mdc"
        applyTo: "**/*.{cpp,hpp}"
      - files: ".cursor/rules/xcsoar-testing.mdc"
        applyTo: "test/**"
      - files: ".cursor/rules/cli-test-utilities.mdc"
        applyTo: "test/**"
      - files: ".cursor/rules/nmea-validity-patterns.mdc"
        applyTo: "src/NMEA/**"
      - files: ".cursor/rules/nmea-validity-patterns.mdc"
        applyTo: "src/Device/**"
      - files: ".cursor/rules/nmea-validity-patterns.mdc"
        applyTo: "src/Computer/**"
      - files: ".cursor/rules/nmea-validity-patterns.mdc"
        applyTo: "src/time/**"
      - files: ".cursor/rules/search-dialog-ux.mdc"
        applyTo: "src/Dialogs/**"
      - files: ".cursor/rules/search-dialog-ux.mdc"
        applyTo: "src/Input/**"
      - files: ".cursor/rules/waypoint-types.mdc"
        applyTo: "src/Engine/Waypoint/**"
      - files: ".cursor/rules/waypoint-types.mdc"
        applyTo: "src/Waypoint/**"
      - files: ".cursor/rules/waypoint-types.mdc"
        applyTo: "src/Dialogs/Waypoint/**"
      - files: ".cursor/rules/svg-icons.mdc"
        applyTo: "Data/icons/**"
      - files: ".cursor/rules/news.txt.mdc"
        applyTo: "NEWS.txt"
      - files: ".cursor/rules/credits-attribution.mdc"
        applyTo: "AUTHORS"
      - files: ".cursor/rules/translations.mdc"
        applyTo: "po/**"
      - files: ".cursor/rules/translations.mdc"
        applyTo: "src/**/*.{cpp,hpp}"
      - files: "doc/i18n.rst"
        applyTo: "po/**"
      - files: ".cursor/rules/developer-docs.mdc"
        applyTo: "**/*.{cpp,hpp,h,c,java,mk}"
      - files: ".cursor/rules/review-human-readable.mdc"
        applyTo: "**/*.{cpp,hpp,h,c,java}"
      - files: ".cursor/rules/review-exponential.mdc"
        applyTo: "**/*.{cpp,hpp,h,c}"
      - files: ".cursor/rules/review-architecture.mdc"
        applyTo: "**/*.{cpp,hpp,h,c,java}"
      - files: "doc/architecture.rst"
        applyTo: "**/*.{cpp,hpp,h,c,java}"
      - files: ".cursor/rules/user-manual.mdc"
        applyTo: "doc/manual/**"
      - files: ".cursor/rules/user-manual.mdc"
        applyTo: "src/Dialogs/**"
      - files: ".cursor/rules/user-manual.mdc"
        applyTo: "src/InfoBoxes/**"
      - files: "doc/policy.rst"
        applyTo: "**/*.{cpp,hpp,h,c,java,mk}"
